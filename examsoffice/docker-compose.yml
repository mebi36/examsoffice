version: '3.8'

services:
  db:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: examsoffice2021
      POSTGRES_DB: studentDB
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - pgnet

  web:
      build:
        context: /home/mebinwobi/Documents/examsoffice
        dockerfile: /home/mebinwobi/Documents/examsoffice/examsoffice/Dockerfile
      container_name: django
      command: python manage.py runserver 0.0.0.0:8000
      volumes:
        - /home/mebinwobi/Documents/examsoffice:/app
      ports:
        - "8005:8000"
      depends_on:
        - db
      environment:
        - DJANGO_SETTINGS_MODULE=examsoffice.settings
      restart: unless-stopped
      networks:
        - pgnet

volumes:
  pgdata:

networks:
  pgnet:

